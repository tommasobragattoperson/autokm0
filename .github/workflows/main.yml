name: Update Auto List

on:
  schedule:
    - cron: '0 * * * *'  # Esegue l'azione ogni ora esatta
  workflow_dispatch:      # Ti permette di premere un tasto e avviarlo a mano

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Permesso necessario per salvare i cambiamenti nel repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring script
        run: python monitor.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html updates_log.json
          git commit -m "Update car list: $(date)" || echo "Nessun cambiamento rilevato"
          git push
